# Hand-written regression cases for the router's IN_CONTEXT / OUT_OF_CONTEXT
# classification. Run with `python tests/run_eval.py`. These are prompt-eval
# cases, not unit tests — expect some noise since an LLM classifies them.
#
# Questions that raise a guilty suspect's plot hole (the maintenance call
# log) must be OUT_OF_CONTEXT: no suspect is told what the log contains.

# --- Neil (innocent, decline) ---
- suspect_id: neil
  question: "Why did the VIP deposit take six minutes?"
  expected: in_context

- suspect_id: neil
  question: "What happened during the jackpot payout?"
  expected: in_context

- suspect_id: neil
  question: "Why did the 01:10 table drop take six minutes?"
  expected: out_of_context

# --- Jade (innocent, improvise) ---
- suspect_id: jade
  question: "What went wrong during the cage refill?"
  expected: in_context

- suspect_id: jade
  question: "Why did the jackpot payout take six minutes?"
  expected: out_of_context

# --- Sarah (guilty, decline) — the drop she did with Danny ---
- suspect_id: sarah
  question: "Did you radio maintenance about the box 6 lock?"
  expected: in_context

- suspect_id: sarah
  question: "Who fixed the jammed lock on the drop?"
  expected: in_context

- suspect_id: sarah
  question: "Why did the table drop take 6 minutes?"
  expected: in_context

- suspect_id: sarah
  question: "Has the box 6 lock jammed on previous nights?"
  expected: out_of_context

- suspect_id: sarah
  question: "What happened at the 23:02 VIP deposit?"
  expected: out_of_context

- suspect_id: sarah
  question: "The maintenance log only shows one call last night, a leaking tap at 21:40. Why isn't Danny's call on it?"
  expected: out_of_context

- suspect_id: sarah
  question: "Maintenance have no record of any call during the table drop. Can you explain that?"
  expected: out_of_context

