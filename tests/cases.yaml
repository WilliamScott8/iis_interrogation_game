# Hand-written regression cases for the router's IN_CONTEXT / OUT_OF_CONTEXT
# classification. Run with `python tests/run_eval.py`. These are prompt-eval
# cases, not unit tests — expect some noise since an LLM classifies them.
#
# Note: questions that raise a guilty suspect's plot hole (e.g. the
# maintenance log) never reach the router — Suspect.ask() catches them with
# `confrontation.triggers` first — so they are not tested here.

# --- Neil (innocent, decline) ---
- suspect_id: neil
  question: "Why did the VIP deposit take ten minutes?"
  expected: in_context

- suspect_id: neil
  question: "What happened during the jackpot payout?"
  expected: in_context

- suspect_id: neil
  question: "Why did the 01:10 table drop take eleven minutes?"
  expected: out_of_context

# --- Jade (innocent, improvise) ---
- suspect_id: jade
  question: "What went wrong during the cage refill?"
  expected: in_context

- suspect_id: jade
  question: "Why did the jackpot payout take nine minutes?"
  expected: out_of_context

# --- Sarah (guilty, decline) — the drop she did with Danny ---
- suspect_id: sarah
  question: "Did you radio maintenance about the box 6 lock?"
  expected: in_context

- suspect_id: sarah
  question: "Who fixed the jammed lock on the drop?"
  expected: in_context

- suspect_id: sarah
  question: "Why did the table drop take 11 minutes?"
  expected: in_context

- suspect_id: sarah
  question: "Has the box 6 lock jammed on previous nights?"
  expected: out_of_context

- suspect_id: sarah
  question: "What happened at the 23:02 VIP deposit?"
  expected: out_of_context

# --- Danny (guilty, improvise) — the drop he did with Sarah ---
- suspect_id: danny
  question: "Did you radio maintenance about the box 6 lock?"
  expected: in_context

- suspect_id: danny
  question: "Who fixed the jammed lock on the drop?"
  expected: in_context

- suspect_id: danny
  question: "Why did the table drop take 11 minutes?"
  expected: in_context

- suspect_id: danny
  question: "Why did the 02:30 refill take nine minutes?"
  expected: out_of_context

- suspect_id: danny
  question: "Did you see who propped the staff exit open at 03:20?"
  expected: out_of_context
