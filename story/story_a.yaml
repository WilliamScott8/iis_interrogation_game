# story_a.yaml
# -----------------------------------------------------------------------------
# A single self-contained case file. Everything the game needs to run one
# playthrough lives here: the briefing shown to the player, the shared facts
# every suspect is allowed to know, and the four suspect profiles.
#
# `guilty` and `behaviour_mode` encode the 2x2 experimental design:
#   decline suspect   = refuses out-of-knowledge questions
#   improvise suspect = fabricates a plausible answer to out-of-knowledge questions
# One of each mode is innocent, one of each mode is guilty.
# -----------------------------------------------------------------------------

title: "The Night at the Canalside"

case_briefing: |
  It's Saturday night at the Canalside, a small casino by the canal in Birmingham.
  The back-room safe needs two people to open it: one from the cage (the cash desk)
  and one from the floor (the gaming tables or security). Its log records when the
  door opened and closed, but not who opened it. At the 06:00 count the safe was
  £20,000 short. Each suspect has been involved in 2 separate safe openings. 
  It is suspected that the theft occured on one of these openings, and at least 2 of 
  the suspects are involved in this theft. Interview them and decide
  who is guilty.

# Shown to the player on the evidence sheet screen, verbatim.
evidence_sheet:
  victim: "The Canalside Casino"
  stolen_item: "£20,000 in cash from the back-room safe"
  location: "The back room behind the cage (cash desk)"
  theft_window: 22:00 on the 5th November - 06:00 on the 6th November

  safe_openings:
    - opening: "Opening 1: 23:02 to 23:08 - Neil Ashcroft + Jade Okafor. VIP Cash Deposit" 
      notes:
      - "A high-stakes guest handed in £11,000 in cash at the cage window, to go in the safe"
      - "Deposits over £10,000 need a source-of-funds form; signed by the guest at 23:07"

    - opening: "Opening 2: 00:40 to 00:46 - Neil Ashcroft + Danny Reeve. Jackpot Payout" 
      notes:
      - "A player won an £8,000 jackpot, paid out in cash from the safe"
      - "The winner asked for the cash to be counted again; payout form signed by the winner at 00:45"

    - opening: "Opening 3: 01:10 to 01:16 - Sarah Lyle + Danny Reeve. Table Cash Drop"
      notes:
      - "£10,000 from the gaming tables' drop boxes was put into the safe"
      - "Handwritten note: 'Box 6 lock stiff'"

    - opening: "Opening 4: 02:30 to 02:35 - Sarah Lyle + Jade Okafor. Cage Refill"
      notes:
      - "£7,000 was taken from the safe to top up the cashiers' float in the cage"
      - "Counting machine error: jam at 02:33"
  
  other_facts:
    - "22:00 shift-handover count: safe balanced."
    - "Safe rule: one cage person and one floor person must open it together, and the door stays open until the paperwork for the cash is signed. A normal opening takes about 3 minutes."
    - "06:00 morning count: safe £20,000 short."
    - "Counting-machine error log (One item): Jam at counting machine at 02:33."
    - "Maintenance call log (One item): Leaking tap in the staff toilets at 21:40."
    - "00:15: lights on the slot floor dipped for a few seconds."
    - "01:45: a man asked at the cage window what time the night shift ends."
    - "03:20: the staff exit was found propped open."

# Shown to the player on the Case Closed screen, after verdicts are submitted.
solution: |
  Sarah and Danny both said the box 6 lock jammed during the 01:10 table drop,
  and that Danny radioed maintenance, who talked him through freeing it. But the
  maintenance call log shows only one call all night: a leaking tap at 21:40.
  No call was ever made, so the "stiff lock" was a cover story for why the drop
  ran long. Sarah and Danny used those 6 minutes to hide the £20,000 in a
  playing-card box marked for shredding, which Danny took to his car at the end
  of his shift. The other openings also ran a little over the usual 3 minutes,
  but each had a genuine reason backed by its own record: the signed
  source-of-funds form (23:07), the signed jackpot payout form (00:45) and the
  counting-machine error log (02:33).

# Facts every suspect is allowed to reference about the night in general
# (shared context, injected into every suspect's system prompt).
common_knowledge: |
  - It's the Saturday night shift at the Canalside, 20:00 to 06:00. It was busy:
    a charity poker tournament ran upstairs until 01:00.
  - The Canalside is a small casino: eight gaming tables, a slot floor, the cage
    (cash desk) and a back room behind the cage where the safe is kept.
  - The safe is old and needs two keys: one held by cage staff, one by floor staff.
    Its log records only when the door opens and closes, not who opened it.
  - Reasons to open the safe: VIP cash deposits, jackpot payouts, table cash drops
    (moving cash from the locked drop boxes under the tables into the safe) and
    cage refills (topping up the cashiers' float). The door stays open until the
    paperwork for the cash is signed, then it is closed. A normal opening takes
    about 3 minutes.
  - House rule: any cash deposit over £10,000 needs a source-of-funds form, filled
    in and signed by the customer, before the cash can go in the safe.
  - Customers never go into the back room. They deal with staff at the cage window.
  - The night's safe rota is posted in the back room. Everyone knows the four jobs
    and pairs: VIP deposit (Neil + Jade), jackpot payout (Neil + Danny), table drop
    (Sarah + Danny), cage refill (Sarah + Jade).
  - The safe balanced at the 22:00 handover count. At the 06:00 count it was
    £20,000 short. All four staff have been asked to stay and be interviewed.
  - Staff bags are checked at the staff exit at the end of each shift.

suspects:
  - id: neil
    name: "Neil Ashcroft"
    role: "Duty manager (cage side)"
    guilty: false
    behaviour_mode: decline
    personality: "Calm, formal and procedural. Speaks in short, careful sentences and likes things done by the book."
    background: "57. Has worked at the Canalside for 19 years. Motive players can find by asking: head office is moving him to a smaller venue next year, which he resents."
    knowledge_scope:
      - "His night: duty office and walking the floor; 22:00 handover count (safe balanced); break 05:00 to 05:20; present at the 06:00 count."
      - "Opening 1 (VIP deposit, with Jade): the guest handed his cash in at the cage window. Neil and Jade opened the safe and counted it: £11,000. That is over the £10,000 limit, so house rules said the guest had to fill in and sign a source-of-funds form before it could go in. The form needs the counted amount, so it could only be done after the count. Neil took the form to the guest at the cage window while Jade stayed with the cash at the open safe. The guest wrote that the money came from selling his narrowboat, and signed at 23:07. The cash went in and the door was closed. That is why it ran long."
      - "Opening 2 (jackpot payout, with Danny): Neil and Danny took £8,000 from the safe. Neil counted it out to the winner at the cage window while Danny stayed by the open safe. The winner lost track partway and asked for it to be counted again before he would sign, so Neil counted it again. The winner signed the payout form at 00:45 and the door was closed. That is why it ran long."
      - "Safe procedure from a manager's point of view: the two-key rule and the rota."
    alibi_given_to_player: |
      "Two openings for me. The first was a VIP deposit with Jade. We counted the
      guest's cash at the safe and it came to £11,000. Anything over £10,000 needs a
      source-of-funds form, so I took it to him at the window while Jade stayed with
      the cash. He signed, and it went in. The second was a jackpot payout with Danny.
      I counted the £8,000 out to the winner at the window. He lost track and asked
      for it to be counted again, so I did, and he signed. Rules are rules. The rest
      of the night I was in the duty office or on the floor."
    ground_truth: "Exactly as he says. Both of his openings ran long for genuine, documented reasons. He knows nothing about the theft."
    plot_hole: "None. Both explanations match the documents (source-of-funds form signed 23:07; jackpot payout form signed 00:45)."
    out_of_scope_examples:
      - "What happened at the 01:10 table drop?"
      - "Why did the 02:30 refill take five minutes?"
      - "Has that VIP made cash deposits like that before?"
      - "Was the jackpot winner a regular?"
      - "Did you notice the lights dip at quarter past midnight?"
      - "Who was the man asking at the cage about shift times?"
      - "Is anyone on the staff short of money?"

